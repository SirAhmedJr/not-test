<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>اختبار الإشعار</title>
</head>
<body>
  <button onclick="showNotification()">تشغيل الإشعار</button>

  <script>
    function showNotification() {
      if (Notification.permission !== "granted") {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            fireNotification();
          } else {
            alert("الإشعارات غير مسموح بها");
          }
        });
      } else {
        fireNotification();
      }
    }

    function fireNotification() {
      const notification = new Notification("تم إنهاء المكالمة", {
        body: "اختبار Wrap-up",
        icon: "https://cdn-icons-png.flaticon.com/512/1827/1827370.png"
      });

      const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
      audio.play();
    }
  </script>
</body>
</html>
